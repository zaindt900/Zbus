<!doctype html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#ffd94f" />
  <title>ZBus — İstanbul Otobüs</title>
  <link rel="icon" href="assets/logo.png" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand"><img src="assets/logo.png" alt="ZBus" /><div><b>ZBus</b><span>İstanbul otobüsleri</span></div></div>
    <button id="themeBtn" class="icon-btn" aria-label="Tema">🌙</button>
  </header>

  <main>
    <section class="hero">
      <div class="hero-copy"><h1>Otobüsünü bul. 🚌</h1><p>Gerçek konumunu kullan, yakın durakları keşfet.</p></div>
      <button id="locateBtn" class="primary">📍 Konumumu bul</button>
    </section>

    <section class="search-card">
      <input id="searchInput" type="search" placeholder="Hat veya durak ara…" autocomplete="off" />
      <button id="searchBtn">Ara</button>
      <div id="searchResult" class="search-result"></div>
    </section>

    <section class="map-wrap"><div id="map"></div><div id="status" class="status">Konum bekleniyor…</div></section>

    <section class="nearby">
      <div class="section-title"><h2>Yakındaki duraklar</h2><span id="distanceLabel">—</span></div>
      <div id="stops" class="stops"><div class="empty">Konumunu açınca gerçek yakındaki duraklar burada görünecek.</div></div>
    </section>
  </main>

  <footer>Veri kaynağı: OpenStreetMap / Overpass. İETT canlı araç verisi bu sürümde sahte gösterilmez.</footer>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <script src="js/app.js"></script>
</body>
</html>
